<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
</head>
<body>

        <img src="" alt="Image of Alien">
        <form action="{{url_for('index.login')}}" method="POST">
