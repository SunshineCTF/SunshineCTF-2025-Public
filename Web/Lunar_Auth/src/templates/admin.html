<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Docking — Authenticate</title>
  <script>
    /*
    To reduce load on our servers from the recent space DDOS-ers we have lowered login attempts by using Base64 encoded encryption
    ("encryption" 💀) on the client side.
    
    TODO: implement proper encryption.
    */
    const real_username = atob("YWxpbXVoYW1tYWRzZWN1cmVk");
    const real_passwd   = atob("UzNjdXI0X1BAJCR3MFJEIQ==");

    document.addEventListener("DOMContentLoaded", () => {
        const form = document.querySelector("form");

        function handleSubmit(evt) {
        evt.preventDefault();

        const username = form.elements["username"].value;
        const password = form.elements["password"].value;

        if (username === real_username && password === real_passwd) {
            // remove this handler and allow form submission
            form.removeEventListener("submit", handleSubmit);
            form.submit();
        } else {
            alert("[ Invalid credentials ]");
        }
        }

        form.addEventListener("submit", handleSubmit);
    });
    </script>
  <style>
    :root{--bg:#02060b;--panel:rgba(255,255,255,0.03);--accent:#66f0ff}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#d8fbff}
    body{
      background: radial-gradient(circle at 10% 10%, #04131a 0%, #000 45%), linear-gradient(180deg,#00151a 0%, #000 100%);
      display:flex;align-items:center;justify-content:center;padding:30px;
    }
    .card{width:460px;padding:24px;border-radius:12px;background:var(--panel);box-shadow:0 8px 30px rgba(2,6,11,0.8);border:1px solid rgba(102,240,255,0.06)}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .logo .ship{font-size:36px}
    h2{margin:0;font-size:20px}
    .muted{color:rgba(210,240,255,0.7);font-size:13px;margin-top:4px}
    form{margin-top:16px;display:grid;gap:10px}
    label{font-size:13px;opacity:0.9}
    input[type="text"],input[type="password"]{
      width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;outline:none;
    }
    .row{display:flex;gap:10px;align-items:center}
    .btn{flex:1;padding:10px;border-radius:8px;border:none;background:linear-gradient(90deg,#3ee0ff,#76f1ff);color:#002;cursor:pointer;font-weight:700}
    .notice{margin-top:8px;padding:10px;border-radius:8px;background:rgba(255,255,255,0.02);font-size:13px}
    .shake{animation:shake 360ms ease-in-out}
    @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="loginTitle">
    <div class="logo">
      <div class="ship">🛰️</div>
      <div>
        <h2 id="loginTitle">Orbital Admin Docking</h2>
        <div class="muted">Strictly for mission control — human captains only.</div>
      </div>
    </div>
    <form id="loginForm" action="{{ url_for('admin') }}" method="POST" autocomplete="off" novalidate>
      <div>
        <label for="username">Commander</label>
        <input id="username" name="username" type="text" required autocomplete="off" />
      </div>

      <div>
        <label for="password">Passphrase</label>
        <input id="password" name="password" type="password" required autocomplete="off" />
      </div>

      <div class="row">
        <button class="btn" type="submit">Initiate Docking</button>
      </div>

      <div id="notice" class="notice muted">No robots — the docking bay will refuse unauthorized agents.</div>
    </form>
  </div>


</body>
</html>
