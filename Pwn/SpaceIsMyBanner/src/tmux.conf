# Top status bar
set-option -g status-position top
set-option -g status-style "fg=white,bg=green"
set-option -g status-format ""
set-option -ag status-format[0] "#[align=centre]SCSS Warning"
set-window-option -g pane-border-status bottom
set-window-option -g pane-border-style "fg=white,bg=green"
set-window-option -g pane-active-border-style "fg=white,bg=green"
set-window-option -g pane-border-format "#[align=centre]Hacker Blocker"