# Top status bar
set-option -g status-position top
set-option -g status-style "fg=purple,bg=yellow"
set-option -g status-format ""
set-option -ag status-format[0] "#[align=centre]!!! TMUX HACKER !!!"
set-window-option -g pane-border-status bottom
set-window-option -g pane-border-style "fg=purple,bg=yellow"
set-window-option -g pane-active-border-style "fg=purple,bg=yellow"
set-window-option -g pane-border-format "#[align=centre]Hacker Blocker TRIGGERED !!!!"